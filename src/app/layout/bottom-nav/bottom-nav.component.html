@if (!isHidden()) {
	<nav aria-label="Navegación principal" class="app-nav fixed bottom-0 inset-x-0 z-50 h-16">
		<div class="grid h-full grid-cols-5 mx-auto">
			@for (item of navItems; track item.label) {
				<a
					matRipple
					[matRippleColor]="'rgba(var(--tb-primary-rgb), 0.12)'"
					[routerLink]="item.route"
					routerLinkActive="text-talent-primary"
					#rla="routerLinkActive"
					[attr.aria-current]="rla.isActive ? 'page' : null"
					[routerLinkActiveOptions]="{ exact: item.route === '/home' }"
					class="inline-flex flex-col items-center justify-center gap-0.5 cursor-pointer transition-colors duration-200 text-talent-text-secondary select-none focus-visible:outline-2 focus-visible:outline-talent-primary"
				>
					<mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
					<span class="text-xs mt-0.5 font-medium tracking-wide">{{ item.label }}</span>
				</a>
			}
		</div>
	</nav>
}
