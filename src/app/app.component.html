<div class="container">
  <h2 class="title-main">Registro de Usuarios</h2>

  <div class="form-group">
    <input 
      type="text" 
      [(ngModel)]="nombre" 
      placeholder="Ingresa el nombre" 
      class="input-field input-name"
    />
    <input 
      type="email" 
      [(ngModel)]="email" 
      placeholder="Ingresa el correo electrónico" 
      class="input-field input-email"
    />
    <button (click)="agregar()" class="btn btn-add">Agregar</button>
  </div>

  <hr class="divider" />

  <h3>Lista de Registros</h3>
  
  <div *ngIf="lista.length === 0" class="empty-message">
    No hay registros disponibles.
  </div>

  <table *ngIf="lista.length > 0" class="data-table">
    <thead>
      <tr>
        <th class="th-name">Nombre</th>
        <th class="th-email">Correo Electrónico</th>
        <th class="th-action">Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of lista; let i = index">
        <td class="td-name">{{ item.nombre }}</td>
        <td class="td-email">{{ item.email }}</td>
        <td class="td-action">
          <button (click)="eliminar(item)" class="btn btn-delete">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
