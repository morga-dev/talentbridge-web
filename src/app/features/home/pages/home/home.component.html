<main class="min-h-screen bg-talent-bg pb-24 selection:bg-talent-secondary/30 transition-colors duration-200">
  
  <div class="relative w-full h-28 sm:h-40 md:h-44 rounded-b-[3.5rem] md:rounded-b-[5rem] bg-talent-primary pt-6 pb-36 px-4 md:px-8 shadow-sm">
    <div class="max-w-5xl mx-auto flex flex-col gap-5">
      
      <div class="flex items-center justify-between">
        <div class="text-white">
          <p class="text-md font-medium text-white/70">Hola de nuevo</p>
          <h1 class="text-2xl font-extrabold tracking-tight mt-0.5">{{ userName }}</h1>
        </div>
        
        <!-- Iniciales de Perfil -->
        <div class="app-surface-strong h-12 w-12 rounded-full border border-white/20 flex items-center justify-center font-bold text-base text-white select-none">
          {{ userInitials }}
        </div>
      </div>

      <!-- Barra de Búsqueda -->
      <div class="relative w-full flex items-center">
        <input 
          type="text" 
          placeholder="Buscar vacantes, becas, empresas..."
          class="app-input-hero w-full rounded-xl py-3 px-4 text-sm font-medium text-white placeholder:text-white/50 focus:outline-hidden focus:border-white/20 focus:bg-white/15 transition-all"
        />
      </div>
    </div>
  </div>

  <div class="max-w-5xl mx-auto px-4 mt-6 space-y-6">
    
    <!-- Barra de Filtros -->
    <app-filter-bar (filterChanged)="onFilterSelected($event)"></app-filter-bar>

    <!-- Fila de Indicadores y Métricas -->
    <div class="grid grid-cols-3 gap-3 md:gap-6">
      
      <div class="app-card rounded-xl p-4 text-center">
        <span class="block text-xl md:text-2xl font-black text-talent-primary">1</span>
        <span class="block text-sm md:text-md font-semibold text-talent-text-secondary/70 mt-0.5">Postulaciones</span>
      </div>

      <div class="app-card rounded-xl p-4 text-center">
        <span class="block text-xl md:text-2xl font-black text-talent-primary">0</span>
        <span class="block text-sm md:text-md font-semibold text-talent-text-secondary/70 mt-0.5">En entrevista</span>
      </div>

      <div class="app-card rounded-xl p-4 text-center">
        <span class="block text-xl md:text-2xl font-black text-talent-primary">1</span>
        <span class="block text-sm md:text-md font-semibold text-talent-text-secondary/70 mt-0.5">Recientes</span>
      </div>

    </div>

    <!-- Recomendados -->
    <app-recommended-section [jobs]="mockJobs"></app-recommended-section>

  </div>
</main>
