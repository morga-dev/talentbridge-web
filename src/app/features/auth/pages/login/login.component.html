<main class="min-h-screen flex flex-col justify-between pb-8 bg-talent-bg selection:bg-talent-secondary/30 transition-colors duration-200">

    <app-page-header>
        <div class="flex justify-center w-full">
            <span class="inline-flex items-center rounded-full bg-[#24272c] px-5 py-2 text-base font-semibold text-white tracking-wide border border-white/10 shadow-xs">
                Bienvenido de nuevo
            </span>
        </div>
    </app-page-header>

    <div class="w-full max-w-7xl mx-auto px-4 md:px-6 flex-1 flex flex-col items-center -mt-16 md:-mt-20 relative z-10">
        
        <div class="app-surface-strong h-24 w-24 md:h-28 md:w-28 rounded-full border-4 border-talent-bg overflow-hidden flex items-center justify-center p-3">
            <img src="/assets/LogoTB.png" 
            alt="Imagen de TalentBridge" 
            class="w-full h-full object-contain select-none" />
        </div>

        <header class="text-center mt-4 mb-8">
            <h1 class="text-2xl md:text-3xl font-extrabold text-talent-text tracking-tight">
                Inicia sesión
            </h1>
            <p class="mt-2 text-base font-medium text-talent-text-secondary max-w-md mx-auto">
                Accede para encontrar oportunidades y conectar con profesionales.
            </p>
        </header>

        <section class="app-card w-full max-w-3xl rounded-4xl p-5 sm:p-7 md:p-8">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="w-full space-y-5">
                <div class="space-y-1.5">
                    
                    <label for="email" 
                    class="block text-sm font-bold uppercase tracking-wider text-talent-text">
                        Correo electrónico
                    </label>
                    <div class="relative flex items-center">
                        <div class="app-icon-badge absolute left-4 p-1.5 rounded-lg">
                            <mat-icon aria-hidden="true">mail</mat-icon>
                        </div>
                        <input id="email" type="email" formControlName="email"
                        placeholder="ejemplo@email.com"
                        class="app-input w-full rounded-2xl py-3.5 pl-14 pr-4 text-base font-medium text-talent-text placeholder:text-talent-text-secondary/40 focus:outline-hidden focus:border-talent-primary transition-colors" />
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="password"
                        class="block text-sm font-bold uppercase tracking-wider text-talent-text">
                        Contraseña
                    </label>
                    <div class="relative flex items-center">
                        <div class="app-icon-badge absolute left-4 p-1.5 rounded-lg">
                            <mat-icon aria-hidden="true">lock</mat-icon>
                        </div>
                        <input id="password" [type]="hidePassword ? 'password' : 'text'"
                            formControlName="password"
                            placeholder="••••••••"
                            class="app-input w-full rounded-2xl py-3.5 pl-14 pr-12 text-base font-medium text-talent-text placeholder:text-talent-text-secondary/40 focus:outline-hidden focus:border-talent-primary transition-colors" />
                        <button type="button" (click)="togglePassword()"
                            class="absolute right-4 text-talent-text-secondary/60 hover:text-talent-primary cursor-pointer transition-colors focus:outline-hidden"
                            [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'">
                            <mat-icon class="w-5 h-5 text-[20px]" aria-hidden="true">
                                {{ hidePassword ? 'visibility' : 'visibility_off' }}
                            </mat-icon>
                        </button>
                    </div>
                </div>

                <div class="text-right">
                    <a href="register" class="text-base font-bold text-talent-primary hover:underline transition-all">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>

                <div class="pt-2">
                    <button type="submit" [disabled]="loginForm.invalid"
                        class="app-button-primary w-full rounded-2xl py-4 text-center text-base font-bold hover:brightness-105 active:scale-[0.99] transition-all cursor-pointer flex items-center justify-center gap-2 disabled:opacity-50 disabled:pointer-events-none"
                        (click)="navigateToDashboard()" >
                        <mat-icon class="w-4 h-4 text-[16px]" aria-hidden="true">arrow_forward</mat-icon>
                        Iniciar sesión
                    </button>
                </div>
            </form>

            <div class="w-full flex items-center justify-center my-6">
                <div class="w-full border-t border-talent-text-secondary/10"></div>
                <span
                    class="px-4 text-base font-medium text-talent-text whitespace-nowrap transition-colors">
                    o continúa con
                </span>
                <div class="w-full border-t border-talent-text-secondary/10"></div>
            </div>

            <div class="w-full grid gap-4 grid-cols-1 sm:grid-cols-2 mb-8">
                <!-- Google -->
                <button type="button" (click)="loginWithGoogle()"
                    class="app-surface-soft w-full rounded-2xl py-3 px-4 inline-flex items-center justify-center gap-2.5 text-base font-bold text-talent-text transition-all cursor-pointer">
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>

                <!-- Linkedin -->
                <button type="button" (click)="loginWithLinkedIn()"
                    class="app-surface-soft w-full rounded-2xl py-3 px-4 inline-flex items-center justify-center gap-2.5 text-base font-bold text-talent-text transition-all cursor-pointer">
                    <svg class="w-5 h-5 shrink-0 text-[#0A66C2] fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/>
                    </svg>
                    LinkedIn
                </button>
            </div>

            <footer class="text-center text-base text-talent-text font-medium">
                ¿No tienes cuenta?
                <a href="register" class="text-talent-primary font-bold hover:underline ml-1">
                    Regístrate
                </a>
            </footer>
        </section>
    </div>
</main>
