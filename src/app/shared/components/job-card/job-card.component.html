<div class="app-card rounded-2xl p-5 flex items-start justify-between gap-4 transition-all hover:shadow-md">
    <div class="space-y-3">
        <div>
            <h3 class="text-base font-extrabold text-talent-text tracking-tight">{{ job.title }}</h3>
            <p class="text-base font-medium text-talent-text-secondary/80 mt-0.5">{{ job.company }}</p>
        </div>

        <mat-chip-set aria-label="Etiquetas de la vacante">
            @for (tag of job.tags; track tag) {
            <mat-chip color="primary" disableRipple>{{ tag }}</mat-chip>
            }
        </mat-chip-set>

        <p class="text-md font-medium text-talent-text-secondary/50">{{ job.location }}</p>
    </div>

    <div class="flex flex-col items-end justify-between h-full min-h-25">
        <div class="app-icon-badge p-2.5 rounded-xl">
            <mat-icon class="w-5 h-5 text-[20px] flex items-center justify-center">work</mat-icon>
        </div>

        <button type="button" mat-button color="primary" class="text-md font-bold" (click)="onViewAllOpportunities()">
            Ver más &rarr;
        </button>
    </div>
</div>
