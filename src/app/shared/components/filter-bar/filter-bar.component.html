<div class="flex items-center gap-3 overflow-x-auto pb-2 scrollbar-none select-none">
  @if (filterOptions(); as opts) {
    @for (opt of opts; track opt.value) {
      <button type="button" mat-flat-button [color]="selected() === opt.value ? 'primary' : undefined"
        [class.app-pill-soft]="selected() !== opt.value" class="whitespace-nowrap" (click)="selectFilter(opt.value)">
        {{ opt.label }}
        @if (opt.count !== undefined && opt.count >= 0) {
          <span class="ml-1.5 text-md opacity-70">({{ opt.count }})</span>
        }
      </button>
    }
  } @else {
    @for (filter of filters(); track filter) {
    <button type="button" mat-flat-button [color]="selected() === filter ? 'primary' : undefined"
        [class.app-pill-soft]="selected() !== filter" class="whitespace-nowrap" (click)="selectFilter(filter)">
        {{ filter }}
      </button>
    }
  }
</div>
