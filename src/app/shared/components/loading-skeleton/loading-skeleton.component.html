<div class="space-y-3" role="status" aria-busy="true" aria-label="Cargando contenido">
	@for (_ of items(); track $index) {
		@switch (variant()) {
			@case ('list') {
				<div class="flex items-center gap-3 animate-pulse">
					<div class="h-10 w-10 rounded-xl bg-talent-border"></div>
					<div class="flex-1 space-y-2">
						<div class="h-3.5 w-3/5 rounded-md bg-talent-border"></div>
						<div class="h-3 w-2/5 rounded-md bg-talent-border"></div>
					</div>
				</div>
			}
			@case ('table-row') {
				<div class="flex items-center gap-4 animate-pulse">
					<div class="h-4 w-1/4 rounded-md bg-talent-border"></div>
					<div class="h-4 w-1/4 rounded-md bg-talent-border"></div>
					<div class="h-4 w-1/6 rounded-md bg-talent-border ml-auto"></div>
				</div>
			}
			@default {
				<div class="app-card rounded-2xl p-5 space-y-3 animate-pulse">
					<div class="flex items-center gap-3">
						<div class="h-10 w-10 rounded-xl bg-talent-border"></div>
						<div class="flex-1 space-y-2">
							<div class="h-4 w-2/3 rounded-md bg-talent-border"></div>
							<div class="h-3 w-1/3 rounded-md bg-talent-border"></div>
						</div>
					</div>
					<div class="h-3 w-full rounded-md bg-talent-border"></div>
					<div class="flex gap-2">
						<div class="h-6 w-16 rounded-full bg-talent-border"></div>
						<div class="h-6 w-20 rounded-full bg-talent-border"></div>
					</div>
				</div>
			}
		}
	}
</div>
