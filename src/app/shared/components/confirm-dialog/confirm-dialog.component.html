<div class="tb-confirm-dialog p-6">
	<div mat-dialog-title class="flex items-center gap-3">
		@if (data.icon) {
			<mat-icon class="text-talent-primary pt-2">{{ data.icon }}</mat-icon>
		}
		<span class="text-xl font-extrabold text-talent-text tracking-tight">{{ data.title }}</span>
	</div>
	<mat-dialog-content>
		<p class="text-base font-medium text-talent-text-secondary leading-relaxed">{{ data.message }}</p>
	</mat-dialog-content>

	<mat-dialog-actions align="end">
		<button type="button" mat-stroked-button [mat-dialog-close]="false">
			{{ data.cancelText ?? 'Cancelar' }}
		</button>
		<button type="button" mat-flat-button [color]="data.confirmColor ?? 'primary'" (click)="onConfirm()">
			{{ data.confirmText ?? 'Confirmar' }}
		</button>
	</mat-dialog-actions>
</div>
